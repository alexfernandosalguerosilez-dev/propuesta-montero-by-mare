<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7e8ee"><link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}"><link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="By Mare"><title>Acceso privado · By Mare</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-body"><main class="login-shell"><div class="login-card"><div class="login-symbol">♡</div><span class="eyebrow">ESPACIO PRIVADO</span><h1>Bienvenida a<br><em>tu agenda By Mare.</em></h1><p class="login-sub">Tus fechas, reservas y pagos en un solo lugar.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post" class="login-form"><label>Usuario<input name="username" autocomplete="username" placeholder="Tu usuario" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required></label><button class="primary login-submit">Entrar a mi agenda <span>♡</span></button></form><div class="login-foot"><span>🔒</span> Solo tú puedes acceder a tus reservas</div></div><div class="login-caption">PROPUESTA MONTERO · BY MARE</div></main></body></html>
